services:
  - type: web
    name: orvexa
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: TRUEFORGE_BASE_URL
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_SERVER_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
