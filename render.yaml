services:
  - type: web
    name: orvexa
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: TRUEFORGE_BASE_URL
        value: 'http://127.0.0.1:8790'
      - key: TRUEFORGE_AUTO_SPAWN_DAEMON
        value: 'true'
      - key: TRUEFORGE_TOKEN
        sync: false
      - key: TRUEFORGE_AGENT_NAME
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_SERVER_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

